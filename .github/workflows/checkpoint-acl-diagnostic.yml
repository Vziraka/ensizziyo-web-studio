name: Temporary checkpoint ownership regression
on:
  push:
    branches: [codex/checkpoint-acl-diagnostic-20261103]
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node --test scripts/context-checkpoint.test.mjs
