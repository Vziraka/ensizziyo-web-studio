name: Studio site checks

on:
  pull_request:
    paths: ['site/**', 'scripts/build-site.mjs', 'scripts/verify-site.mjs', 'scripts/inquiry.test.mjs', 'netlify.toml', '.github/workflows/site-check.yml']
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build-site.mjs', 'scripts/verify-site.mjs', 'scripts/inquiry.test.mjs', 'netlify.toml', '.github/workflows/site-check.yml']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: find site scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - run: node scripts/build-site.mjs
      - run: node scripts/verify-site.mjs
      - run: node --test scripts/inquiry.test.mjs
