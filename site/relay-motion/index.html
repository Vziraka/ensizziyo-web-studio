<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay — Workflow studio</title><link rel="stylesheet" href="../shared/preview.css"><link rel="stylesheet" href="relay.css"></head><body><a class="skip" href="#main">Skip to workflow</a><header><a class="brand" href="#service"><img src="icons/workflow.svg" alt="">RELAY</a><span class="demo">Demo workspace</span><nav aria-label="Workflows"><button data-flow="service"><img src="icons/clipboard-list.svg" alt="">Service requests</button><button data-flow="quote"><img src="icons/file-text.svg" alt="">Quote follow-ups</button><button data-flow="appointment"><img src="icons/calendar-clock.svg" alt="">Appointment reminders</button></nav><button id="test" class="primary"><img src="icons/play.svg" alt="">Test workflow</button></header><div class="workspace"><aside class="tools" aria-label="Tools"><button data-tool="Steps"><img src="icons/workflow.svg" alt="">Steps</button><button data-tool="Logic"><img src="icons/git-branch.svg" alt="">Logic</button><button data-tool="Data"><img src="icons/database.svg" alt="">Data</button><button data-tool="Tools"><img src="icons/wrench.svg" alt="">Tools</button><button data-tool="Variables"><img src="icons/braces.svg" alt="">Variables</button></aside><main id="main"><div class="heading"><h1>Service requests</h1><p id="description"></p></div><div class="run-toolbar"><label>Sample<select id="sample"><option value="positive">REQ-018 / In area</option><option value="negative">REQ-019 / Out of area</option></select></label><span id="version">Workflow v1</span><button id="edit-rule"><img src="icons/sliders-horizontal.svg" alt="">Edit rule</button></div><section class="canvas" aria-label="Workflow steps"></section><section class="results"></section><section class="timeline"><div><strong id="run-status">Ready to test</strong><output id="elapsed">0.0 / 10.0 seconds</output></div><label class="sr-only" for="scrubber">Run time</label><input id="scrubber" type="range" min="0" max="10" step="0.1" value="0"><div class="run-actions"><button id="play" class="primary"><img src="icons/play.svg" alt="">Play test</button><button id="next"><img src="icons/skip-forward.svg" alt="">Next step</button><button id="restart"><img src="icons/rotate-ccw.svg" alt="">Restart</button></div></section></main><aside class="inspector" aria-label="Step inspector"></aside></div><dialog id="utility"><h2></h2><div class="utility-body"></div><form method="dialog"><button>Close</button></form></dialog><p class="sr-only" id="announcement" aria-live="polite"></p><script type="module" src="relay.mjs"></script></body></html>
