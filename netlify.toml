[build]
command = "npm ci --prefix pipeline --ignore-scripts && node scripts/build-site.mjs"
publish = "dist"
ignore = "if [ \"$CONTEXT\" != production ] || [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- site scripts/build-site.mjs netlify.toml ':(exclude)site/README.md'; [ $? -eq 0 ]"

[build.environment]
NODE_VERSION = "24"

[functions]
directory = "pipeline/netlify-functions"
node_bundler = "esbuild"
included_files = ["pipeline/lifecycle-ui/**", "pipeline/follow-up-template.mjs", "pipeline/business-types.mjs"]

[[redirects]]
from = "/"
to = "/studio/"
status = 302
