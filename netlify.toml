[build]
command = "node scripts/build-site.mjs"
publish = "dist"
ignore = "if [ \"$CONTEXT\" != production ] || [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- site scripts/build-site.mjs netlify.toml ':(exclude)site/README.md'; [ $? -eq 0 ]"

[build.environment]
NODE_VERSION = "24"

[[redirects]]
from = "/"
to = "/studio/"
status = 302

[[headers]]
for = "/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "SAMEORIGIN"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
