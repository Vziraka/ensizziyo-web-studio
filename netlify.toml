[build]
command = "npm ci --prefix pipeline --ignore-scripts && node scripts/build-desk-assets.mjs && node scripts/build-site.mjs"
publish = "dist"
ignore = "if [ \"$CONTEXT\" != production ] || [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- site scripts/build-site.mjs netlify.toml ':(exclude)site/README.md'; [ $? -eq 0 ]"

[build.environment]
NODE_VERSION = "24"

# The public feature flag is a source literal, not an authentication credential.
# Omit only that false positive in Deploy Previews; all credential scanning stays enabled.
[context.deploy-preview.environment]
SECRETS_SCAN_OMIT_KEYS = "EVZ_OPERATIONS_DESK_ENABLED"

[functions]
directory = "pipeline/netlify-functions"
node_bundler = "esbuild"

[[redirects]]
from = "/"
to = "/studio/"
status = 302
