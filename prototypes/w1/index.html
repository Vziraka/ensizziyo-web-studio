<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Two isolated homepage design prototypes for Ensizziyo Web Studio. Draft content; all inquiries are simulated.">
  <title>A — The local studio · W1 prototype</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">

</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="direction"></div>
  <noscript>This design prototype needs JavaScript for the direction switcher and simulated inquiries.</noscript>

  <nav class="prototype-switcher" aria-label="Design prototype controls">
    <span class="lab-label">W1 <span>DESIGN LAB</span></span>
    <button class="cycle" data-cycle="-1" aria-label="Previous direction">←</button>
    <button data-variant="a" aria-current="true"><b>A</b> <span>The local studio</span></button>
    <button data-variant="b"><b>B</b> <span>The digital atelier</span></button>
    <button class="cycle" data-cycle="1" aria-label="Next direction">→</button>
    <span class="prototype-note" role="status">Draft · nothing is sent</span>
  </nav>

  <template id="direction-a">
    <div class="local-studio">
      <header class="site-header wrap">
        <a class="wordmark" href="#main" aria-label="Ensizziyo Web Studio, homepage">
          <img src="assets/mark.svg" width="32" height="32" alt="">
          <span>ensizziyo<span class="wordmark-sub">WEB STUDIO</span></span>
        </a>
        <nav class="header-links" aria-label="Page navigation">
          <a href="#services">The offer</a><a href="#process">How it works</a><a href="#questions">Questions</a>
        </nav>
        <button class="button small outline" data-inquire>Let’s talk <span aria-hidden="true">↗</span></button>
      </header>

      <main id="main" tabindex="-1">
        <section class="a-hero wrap" aria-labelledby="a-title">
          <div class="a-intro">
            <p class="eyebrow"><span class="status-dot"></span> INDEPENDENT WEB STUDIO · FAIRFAX + DMV</p>
            <h1 id="a-title">Good work<br>deserves a<br><em>better website.</em></h1>
            <p class="hero-description">Custom websites for local service businesses. Make what you do clear, and make it easy for people to get in touch.</p>
            <button class="button" data-inquire>Tell me about your project <span aria-hidden="true">↗</span></button>
            <a class="text-link hero-link" href="#concept">See what that could look like <span aria-hidden="true">↓</span></a>
            <p class="hero-footnote">Clear scope. Thoughtful design. A site you can own.</p>
          </div>
          <figure class="a-artboard" id="concept">
            <div class="artboard-heading"><span>A LITTLE POSSIBILITY</span><span aria-hidden="true">↗</span></div>
            <div class="mini-site">
              <div class="mini-header"><span class="fieldwork">fieldwork<span>HOME RENOVATIONS</span></span><span class="mini-nav">Made for living.</span></div>
              <div class="mini-image">
                <img src="assets/renovation-concept.png" width="1536" height="1024" alt="Illustrative, AI-generated kitchen with oak cabinets, stone island, and garden windows">
                <div class="mini-image-copy"><span>KITCHENS · BATHS · ADDITIONS</span><h2>A home that<br>feels like you.</h2></div>
              </div>
              <div class="mini-bottom"><p>Thoughtful spaces.<br>A clear first step.</p><button class="mini-cta" data-concept>Try the demo <span aria-hidden="true">↗</span></button></div>
            </div>
            <figcaption><span class="concept-tag">CONCEPT ONLY</span> Fictional business. Illustrative image. No client results.</figcaption>
            <div class="artboard-decoration" aria-hidden="true">✳</div>
          </figure>
        </section>

        <section class="a-offer wrap section-space" id="services" aria-labelledby="offer-title">
          <div class="section-intro"><p class="eyebrow">01 / THE OFFER</p><h2 id="offer-title">A website that<br><em>does its job.</em></h2><p>Your customers should understand what you do, where you work, and how to take the next step.</p></div>
          <div class="service-list">
            <details open><summary><span class="number">01</span><span>Custom websites</span><span class="plus" aria-hidden="true">+</span></summary><p>A clear message, a design that fits your business, and a usable path from the first visit to an inquiry. Built for phones and desktops.</p></details>
            <details><summary><span class="number">02</span><span>Focused landing pages</span><span class="plus" aria-hidden="true">+</span></summary><p>One service, campaign, or offer, explained on a focused page with one clear next step. Advertising spend and campaign management are separate.</p></details>
            <details><summary><span class="number">03</span><span>Care when you need it</span><span class="plus" aria-hidden="true">+</span></summary><p>Optional updates and ongoing website care, with the tasks, response times, and price agreed separately from your build.</p></details>
          </div>
        </section>

        <section class="a-process section-space" id="process" aria-labelledby="process-title">
          <div class="wrap"><div class="process-heading"><p class="eyebrow">02 / WORKING TOGETHER</p><h2 id="process-title">A clear plan.<br><em>Room to get it right.</em></h2></div>
          <ol class="process-steps"><li><span class="number">01 / UNDERSTAND</span><h3>Start with your business.</h3><p>Talk through your services, customers, and what the site needs to do. Agree a written scope before a quote.</p></li><li><span class="number">02 / SHAPE</span><h3>See it before it goes live.</h3><p>Review the message and design in a working preview. Make the important decisions together.</p></li><li><span class="number">03 / HAND OVER</span><h3>Leave with a usable site.</h3><p>Check the agreed inquiry journey, mobile experience, and keyboard access. Document ownership and handover.</p></li></ol></div>
        </section>

        <section class="a-about wrap section-space" aria-labelledby="about-title"><p class="eyebrow">03 / THE PERSON BEHIND THE STUDIO</p><div><h2 id="about-title">A small studio.<br><em>A direct conversation.</em></h2><p>I’m Ensizziyo. This studio starts with a simple idea: local businesses deserve websites that explain their work with care. We’ll begin with your business, agree what’s needed, and review the design together.</p><span class="draft-bio">Founder introduction · draft for your review</span></div></section>

        <section class="a-faq wrap section-space" id="questions" aria-labelledby="questions-title"><div><p class="eyebrow">04 / A FEW USEFUL ANSWERS</p><h2 id="questions-title">Before we begin.</h2></div><div class="faq-list">
          <details><summary>What does a project cost?<span aria-hidden="true">+</span></summary><p>The early planning range is $1,500–$2,000+, depending on scope. This is a draft price hypothesis, not a quote. Pages, content, integrations, and revisions are agreed before pricing. Hosting, subscriptions, and ongoing care are separate.</p></details>
          <details><summary>Will a new site guarantee more leads?<span aria-hidden="true">+</span></summary><p>No. A clearer website can make the next step easier, but results also depend on the offer, traffic, market, and follow-up. No lead or revenue guarantee is included.</p></details>
          <details><summary>Can you work with an agency?<span aria-hidden="true">+</span></summary><p>Yes, agency development partnerships are a separate conversation. Share the project, delivery needs, and responsibilities so we can assess the fit.</p></details>
        </div></section>

        <section class="a-contact" aria-labelledby="a-contact-title"><div class="wrap"><p class="eyebrow">LET’S TALK ABOUT WHAT’S NEXT</p><h2 id="a-contact-title">Your work is worth<br><em>a closer look.</em></h2><button class="button light" data-inquire>Tell me about your project <span aria-hidden="true">↗</span></button><p>A few details are enough to start a conversation.</p></div></section>
      </main>
      <footer class="site-footer wrap"><span>ensizziyo / web studio</span><button class="text-link" data-inquire data-agency>Agency project? Let’s talk <span aria-hidden="true">↗</span></button><span>Internal working name · W1 prototype</span></footer>

      <dialog class="inquiry-dialog" aria-labelledby="inquiry-title" aria-describedby="inquiry-note">
        <button class="dialog-close" data-close aria-label="Close inquiry">×</button><p class="eyebrow">A FIRST CONVERSATION</p><h2 id="inquiry-title">What are you<br><em>working on?</em></h2><p id="inquiry-note">Prototype only. Use made-up details; nothing is sent or saved.</p>
        <form class="inquiry-form" data-studio-form>
          <label>Your name <input name="name" autocomplete="off" required maxlength="100" placeholder="Alex Example"></label>
          <label>Email <input type="email" name="email" autocomplete="off" required maxlength="254" placeholder="alex@example.com"></label>
          <label>What do you need? <select name="project"><option>New website</option><option>Website redesign</option><option>Landing page</option><option>Agency partnership</option><option>Not sure yet</option></select></label>
          <label>A little about your business <textarea name="details" required maxlength="2000" rows="3" placeholder="What do you do, and what should your website make easier?"></textarea></label>
          <button class="button" type="submit">Preview the inquiry <span aria-hidden="true">↗</span></button>
        </form>
        <div class="form-result" role="status" tabindex="-1" hidden><span class="result-mark" aria-hidden="true">✓</span><h3>That’s the idea.</h3><p>Your demo inquiry is complete. No message was sent or saved.</p><p>In the finished site, this step will send your inquiry to the agreed destination and confirm only after delivery succeeds.</p><button class="button outline" type="button" data-reset>Try it again <span aria-hidden="true">↗</span></button></div>
      </dialog>
    </div>
  </template>

  <template id="direction-b">

      <main id="main" tabindex="-1">

        <section class="b-concept wrap" id="concept" aria-labelledby="b-concept-title">

          <div class="b-stage">
            <div class="b-project" data-concept-panel="website"><img src="assets/renovation-concept.png" width="1536" height="1024" alt="Illustrative, AI-generated renovation concept: a sunlit oak kitchen"><div class="b-project-top"><span class="fieldwork">fieldwork<span>HOME RENOVATIONS</span></span><span class="concept-tag">FICTIONAL BUSINESS / CONCEPT ONLY</span></div><div class="b-project-bottom"><h2 id="b-concept-title">A home that<br><em>feels like you.</em></h2><button class="button light" data-show-inquiry>See the inquiry step <span aria-hidden="true">↗</span></button></div></div>
            <div class="b-sample-inquiry" data-concept-panel="inquiry" hidden><div><span class="concept-tag">FIELDWORK / FICTIONAL BUSINESS</span><h2>A clear place<br><em>to begin.</em></h2><p>One focused inquiry path, with the right questions for the business.</p><span class="sample-notice">Concept interaction. No estimate is requested.</span></div><form data-concept-form><label>What would you like to work on?<select name="service"><option>Kitchen renovation</option><option>Bathroom renovation</option><option>Home addition</option></select></label><label>Tell us a little about the space<textarea name="space" rows="3" placeholder="Try a made-up project."></textarea></label><button class="button" type="submit">Preview request <span aria-hidden="true">↗</span></button><p class="sample-status" role="status"></p></form></div>
          </div>
          <div class="b-project-caption"><div><span class="eyebrow">HOME SERVICES / CONCEPT STUDY</span><h3>Good design makes the next step feel natural.</h3></div><p>An illustrative renovation website: show the service, let the work speak, and give visitors a clear place to inquire. Fictional business and generated image; no client results.</p></div>
        </section>

        <section class="b-process wrap section-space" id="process" aria-labelledby="b-process-title"><div><p class="eyebrow">02 / THE APPROACH</p><h2 id="b-process-title">Less guesswork.<br><em>More intention.</em></h2><p>A custom website or focused landing page, with the message, design, and inquiry journey considered together. Optional care and integrations are scoped separately.</p></div><div class="process-explorer"><div class="process-buttons" role="group" aria-label="Explore the project process"><button data-process="scope" aria-pressed="true"><span>01</span> Scope <span aria-hidden="true">↗</span></button><button data-process="design" aria-pressed="false"><span>02</span> Design <span aria-hidden="true">↗</span></button><button data-process="build" aria-pressed="false"><span>03</span> Build <span aria-hidden="true">↗</span></button></div><div class="process-copy" aria-live="polite"><span class="eyebrow">START WITH THE RIGHT QUESTIONS</span><h3>Decide what the site needs to do.</h3><p>Talk through your business, customers, content, and inquiry needs. Agree the deliverables and responsibilities in writing before quoting.</p></div></div></section>

        <section class="b-founder wrap"><p class="eyebrow">A SMALL STUDIO. A DIRECT CONVERSATION.</p><p>I’m Ensizziyo. We’ll begin with your business, agree what’s needed, and review the design together.</p><span class="draft-bio">Founder introduction · draft for your review</span></section>

        <section class="b-contact wrap section-space" id="contact" aria-labelledby="b-contact-title"><div><p class="eyebrow">03 / YOUR NEXT CHAPTER</p><h2 id="b-contact-title">Let’s give your<br>work <em>a home.</em></h2><p>Tell me a little about your business and what you have in mind. We’ll use that as the starting point for a scope conversation.</p><p class="stub-note" id="b-inquiry-note">Prototype only. Use made-up details.<br>Nothing is sent or saved.</p><details class="budget-note"><summary>A note on budget <span aria-hidden="true">+</span></summary><p>Early planning range: $1,500–$2,000+, depending on written scope. Draft price hypothesis, not a quote. Hosting, subscriptions, care, and advertising are separate. No lead or revenue guarantees.</p></details></div>
          <div class="brief-box"><form class="inquiry-form" data-studio-form aria-describedby="b-inquiry-note"><div data-brief-step="1"><p class="eyebrow">STEP 01 / 02</p><fieldset><legend>What are you planning?</legend><label class="project-choice"><input type="radio" name="project" value="New website" required> A new website <span aria-hidden="true">↗</span></label><label class="project-choice"><input type="radio" name="project" value="Website redesign" required> A website redesign <span aria-hidden="true">↗</span></label><label class="project-choice"><input type="radio" name="project" value="Landing page" required> A landing page <span aria-hidden="true">↗</span></label><label class="project-choice"><input type="radio" name="project" value="Agency partnership" required> An agency partnership <span aria-hidden="true">↗</span></label><label class="project-choice"><input type="radio" name="project" value="Not sure yet" required> I’m exploring <span aria-hidden="true">↗</span></label></fieldset><button class="button" type="button" data-next>Continue <span aria-hidden="true">→</span></button></div>
          <div data-brief-step="2" hidden><div class="brief-step-heading"><p class="eyebrow">STEP 02 / 02</p><button class="text-link" type="button" data-back>← Back</button></div><h3>And a little about you.</h3><label>Your name <input name="name" autocomplete="off" required maxlength="100" placeholder="Alex Example"></label><label>Email <input type="email" name="email" autocomplete="off" required maxlength="254" placeholder="alex@example.com"></label><label>A little about your business <textarea name="details" required maxlength="2000" rows="3" placeholder="What do you do, and what should your website make easier?"></textarea></label><button class="button" type="submit">Preview the inquiry <span aria-hidden="true">↗</span></button></div></form>
          <div class="form-result" role="status" tabindex="-1" hidden><span class="result-mark" aria-hidden="true">✓</span><h3>A good place to start.</h3><p>Your demo brief is complete. No message was sent or saved.</p><p>In the finished site, this step will send your inquiry to the agreed destination and confirm only after delivery succeeds.</p><button class="button" type="button" data-reset>Try it again <span aria-hidden="true">↗</span></button></div></div>
