<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Eight Ensizziyo studio previews: websites, business systems, practical automation and AI, and marketing support. Local experiment; inquiries are simulated.">
  <title>Studio · Ensizziyo design preview</title>
  <link rel="stylesheet" href="studio.css">
  <script src="studio.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app"></div>
  <nav class="lab-dock" aria-label="Design preview controls">
    <a href="./">All 8 previews</a>
    <button type="button" data-cycle="-1" aria-label="Previous design">←</button>
    <label class="sr-only" for="direction-select">Design direction</label>
    <select id="direction-select">
      <option value="1">1 · Studio</option><option value="2">2 · Focus</option>
      <option value="3">3 · Index</option><option value="4">4 · Gallery</option>
      <option value="5">5 · Frame</option><option value="6">6 · Ledger</option>
      <option value="7">7 · Surface</option><option value="8">8 · Common</option>
    </select>
    <button type="button" data-cycle="1" aria-label="Next design">→</button>
    <span>Prototype · nothing is sent</span>
  </nav>
  <p id="page-announcement" class="sr-only" aria-live="polite"></p>
  <noscript>This interactive design preview needs JavaScript. Nothing is connected to a live inquiry service.</noscript>
</body>
</html>
